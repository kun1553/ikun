    <meta name="description" content="张栢焜的个人博客 —— 计算机科学与技术，记录算法、后端、前端工程化的学习与踩坑。" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%232f6fed'/%3E%3Ctext x='50' y='68' font-size='52' font-family='system-ui' font-weight='700' fill='white' text-anchor='middle'%3E%E6%A2%8F%3C/text%3E%3C/svg%3E" />
    <script>
      // 在首屏渲染前确定主题，避免深色模式下的白屏闪烁
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = saved || (prefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
